<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>摩加迪沙 1993｜分支互动样片</title>
    <style>
      :root { color-scheme: dark; --sand:#e9dfcb; --ink:#151a18; --signal:#dc8650; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#060808; color:var(--sand); font-family:Inter,"PingFang SC","Noto Sans SC",Arial,sans-serif; }
      .player { width:min(96vw,1600px,calc((100vh - 48px) * 16 / 9)); }
      .screen { position:relative; width:100%; box-shadow:0 22px 80px rgba(0,0,0,.6); }
      .stage { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#000; }
      .screen video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; opacity:0; transition:opacity .45s linear; }
      .screen video.on { opacity:1; }
      .note { position:absolute; left:0; right:0; bottom:13%; text-align:center; font-size:clamp(14px,1.5vw,22px); color:#f2e7d2; text-shadow:0 2px 12px #000; opacity:0; transition:opacity .6s; pointer-events:none; }
      .note.on { opacity:1; }
      .veil { position:absolute; inset:0; display:flex; align-items:flex-end; padding:0 6% 5%; background:linear-gradient(0deg,rgba(5,7,8,.92) 0%,rgba(5,7,8,.62) 24%,transparent 58%); opacity:0; pointer-events:none; transition:opacity .5s; }
      .veil.on { opacity:1; pointer-events:auto; }
      .panel { width:100%; display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr); column-gap:40px; align-items:end; }
      .eyebrow { margin:0 0 8px; color:#e8a477; font-size:13px; font-weight:700; letter-spacing:.17em; }
      h1 { margin:0; font-size:clamp(24px,2.8vw,40px); line-height:1.15; font-weight:650; }
      .copy { margin:10px 0 0; color:#c9c9c0; font-size:clamp(13px,1.25vw,18px); line-height:1.5; }
      .choices { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:10px; }
      .choices button { position:relative; min-height:72px; padding:12px 16px 14px; border:0; border-left:2px solid var(--signal); background:rgba(18,23,22,.62); color:var(--sand); font:inherit; text-align:left; cursor:pointer; overflow:hidden; transition:background-color .16s,color .16s,transform .16s; }
      .choices button b { display:block; font-size:clamp(14px,1.3vw,19px); font-weight:650; }
      .choices button span { display:block; margin-top:4px; font-size:clamp(12px,1vw,14px); color:#a9aca4; }
      .choices button kbd { position:absolute; top:10px; right:12px; font:600 11px/1 Inter,Arial; color:#e8a477; opacity:.8; }
      .choices button:hover,.choices button:focus-visible { background:var(--sand); color:var(--ink); outline:none; transform:translateY(-2px); }
      .choices button:hover span,.choices button:focus-visible span { color:#3a3f3b; }
      .choices button.default::after { content:""; position:absolute; left:0; bottom:0; height:3px; width:var(--left,100%); background:var(--signal); }
      .primary { min-height:54px; padding:10px 22px; border:0; background:var(--signal); color:#181c19; font:650 17px/1.2 inherit; cursor:pointer; }
      .ghost { min-height:54px; padding:10px 18px; border:1px solid rgba(233,223,203,.35); background:transparent; color:var(--sand); font:600 15px/1.2 inherit; cursor:pointer; }
      .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
      .path { margin-top:12px; font-size:14px; color:#e8a477; letter-spacing:.04em; }
      .footer { display:flex; justify-content:space-between; gap:16px; padding:12px 2px; color:#8f978f; font-size:12px; }
      .footer strong { color:#e8a477; font-weight:600; }
      @media(max-width:720px){ .panel{grid-template-columns:1fr;row-gap:12px} .choices{grid-auto-flow:row} }
      /* 竖屏手机：16:9 画面太矮放不下选项，面板移到画面下方 */
      @media(max-width:720px) and (orientation:portrait){
        body { place-items:start center; padding-top:8vh; }
        .veil { position:static; display:none; padding:18px 4px 0; background:none; }
        .veil.on { display:flex; }
        .choices button { min-height:60px; }
        .footer .keys { display:none; }
      }
    </style>
  </head>
  <body>
    <main class="player">
      <div class="screen" id="screen">
        <div class="stage">
          <video id="v0" playsinline preload="auto"></video>
          <video id="v1" playsinline preload="auto"></video>
          <div class="note" id="note"></div>
        </div>
        <div class="veil on" id="veil"><section class="panel" id="panel"></section></div>
      </div>
      <div class="footer">
        <span id="status">分支互动样片 · 约 70 秒一条路线</span>
        <span class="keys"><strong>2 次选择 · 6 条路线</strong> · 键盘 A/B、1/2/3 也可选择</span>
      </div>
    </main>
    <audio id="bgm" loop preload="auto"></audio>
    <script src="graph.js"></script>
    <script src="clips/narr.js"></script>
    <script src="player.js"></script>
  </body>
</html>
