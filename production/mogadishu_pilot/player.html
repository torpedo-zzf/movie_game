<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>摩加迪沙｜3D 战术沙盘互动样片</title>
    <style>
      :root { color-scheme: dark; --sand:#e9dfcb; --ink:#151a18; --signal:#dc8650; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#080b0b; color:var(--sand); font-family:Inter,"Noto Sans JP",Arial,sans-serif; }
      .player { width:min(96vw,1440px); }
      .screen { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#101411; box-shadow:0 22px 80px rgba(0,0,0,.55); }
      video { display:block; width:100%; height:100%; object-fit:contain; background:#080b0b; }
      .veil { position:absolute; inset:0; display:flex; align-items:flex-end; padding:0 6% 5.2%; background:linear-gradient(0deg,rgba(5,7,8,.97) 0%,rgba(5,7,8,.78) 22%,rgba(5,7,8,.18) 48%,transparent 78%); }
      .veil[hidden] { display:none; }
      .panel { width:100%; max-width:none; display:grid; grid-template-columns:minmax(0,.92fr) minmax(0,1.5fr); grid-template-rows:auto auto auto; column-gap:42px; align-items:end; padding:0; color:var(--sand); background:transparent; border:0; box-shadow:none; }
      .eyebrow { grid-column:1; margin:0 0 10px; color:#e8a477; font-size:13px; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
      h1,h2,p { margin:0; }
      h1 { grid-column:1; font-size:clamp(25px,3vw,42px); line-height:1.12; font-weight:650; }
      .copy { grid-column:1; margin-top:10px; color:#c9c9c0; font-size:clamp(14px,1.35vw,19px); line-height:1.45; }
      .choices { grid-column:2; grid-row:1/4; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-self:end; margin:0; }
      .choices.three { grid-template-columns:repeat(3,1fr); }
      button { min-height:54px; padding:10px 14px; border:0; border-left:2px solid var(--signal); background:rgba(18,23,22,.58); color:var(--sand); font:600 clamp(14px,1.25vw,18px)/1.25 Inter,"Noto Sans JP",Arial,sans-serif; cursor:pointer; text-align:left; transition:background-color .16s ease,color .16s ease,transform .16s ease; }
      button:hover,button:focus-visible { background:var(--sand); color:var(--ink); outline:none; transform:translateY(-2px); }
      button.primary { border-left-color:var(--signal); background:var(--signal); color:#181c19; text-align:center; }
      .start-card { grid-template-columns:1fr auto; max-width:100%; }
      .start-card .eyebrow,.start-card h1 { grid-column:1/-1; }
      .start-card .copy { grid-column:1; }
      .start-card button { grid-column:2; grid-row:3; min-width:200px; }
      .footer { display:flex; justify-content:space-between; gap:16px; padding:12px 2px; color:#969e98; font-size:12px; letter-spacing:.04em; }
      .footer strong { color:#e8a477; font-weight:600; }
      @media(max-width:680px) {
        .veil { padding:0 5% 5%; }
        .panel { grid-template-columns:1fr; grid-template-rows:auto; gap:8px; }
        .eyebrow,h1,.copy,.choices { grid-column:1; grid-row:auto; }
        .choices,.choices.three { grid-template-columns:1fr; gap:6px; margin-top:8px; }
        button { min-height:44px; }
        .start-card button { grid-column:1; grid-row:auto; width:100%; }
        .footer { display:block; }.footer span { display:block; margin-top:4px; }
      }
    </style>
  </head>
  <body>
    <main class="player">
      <div class="screen" id="screen">
        <video id="film" src="renders/mogadishu_sample_60s.mp4" preload="auto" playsinline></video>
        <div class="veil" id="start-veil">
          <section class="panel start-card">
            <p class="eyebrow">MOGADISHU · 1993 · 3D SANDBOX</p>
            <h1>任务开始后，计划变了</h1>
            <p class="copy">镜头沿战术沙盘推进；到现场与片尾节点时暂停，等你选择。</p>
            <button class="primary" id="start-button">开始观看</button>
          </section>
        </div>
        <div class="veil" id="choice-veil" hidden>
          <section class="panel" id="choice-panel" aria-live="polite"></section>
        </div>
      </div>
      <div class="footer">
        <span id="player-status">互动模式 · 60 秒样片</span>
        <span><strong>两处选择</strong> · 档案次序与片尾视角</span>
      </div>
    </main>
    <script src="player.js"></script>
  </body>
</html>
